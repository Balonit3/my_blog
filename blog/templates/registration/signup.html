<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        /* Те же стили, что и в login.html */
        .errorlist { color: red; }
    </style>
</head>
<body>
    <div class="auth-form">
        <h1>Регистрация</h1>

        <!-- Вывод ошибок -->
        {% if form.errors %}
            <p style="color: red;">Исправьте ошибки в форме.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-field">
                <label>Логин:</label>
                {{ form.username }}
                {{ form.username.errors }}
            </div>

            <div class="form-field">
                <label>Пароль:</label>
                {{ form.password1 }}
                {{ form.password1.errors }}
            </div>

            <div class="form-field">
                <label>Подтверждение пароля:</label>
                {{ form.password2 }}
                {{ form.password2.errors }}
            </div>

            <button type="submit">Зарегистрироваться</button>
        </form>

        <div class="links">
            <a href="{% url 'login' %}">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</body>
</html>
