<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        .auth-form { max-width: 400px; margin: 50px auto; padding: 20px; }
        .form-field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; }
        .links { margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-form">
        <h1>Вход в аккаунт</h1>

        <!-- Вывод ошибок -->
        {% if form.errors %}
            <p style="color: red;">Неверный логин или пароль.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-field">
                <label>Логин:</label>
                {{ form.username }}
            </div>

            <div class="form-field">
                <label>Пароль:</label>
                {{ form.password }}
            </div>

            <button type="submit">Войти</button>
        </form>

        <div class="links">
            <a href="{% url 'signup' %}">Регистрация</a> |
            <a href="#">Забыли пароль?</a>
        </div>
    </div>
</body>
</html>
